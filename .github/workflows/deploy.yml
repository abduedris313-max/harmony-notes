name: Production Build & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Build & Verify Production Applet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run TypeScript & Linter Verification
        run: npm run lint

      - name: Build Full-Stack Production Artifacts
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Prepare GitHub Pages Static Files
        run: |
          # Disable Jekyll processing for GitHub Pages so all assets are served directly
          touch dist/.nojekyll
          # Copy index.html to 404.html for client-side SPA fallback
          cp dist/index.html dist/404.html
          echo "GitHub Pages compatibility files (.nojekyll, 404.html) prepared."

      - name: Verify Build Output
        run: |
          test -d dist || { echo "Missing dist directory"; exit 1; }
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/404.html || { echo "Missing dist/404.html"; exit 1; }
          test -f dist/.nojekyll || { echo "Missing dist/.nojekyll"; exit 1; }
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          echo "Production artifacts verified successfully."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Upload Generic Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
