name: Production Build & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Verify Production Applet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run TypeScript & Linter Verification
        run: npm run lint

      - name: Build Full-Stack Production Artifacts
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Verify Build Output
        run: |
          test -d dist || { echo "Missing dist directory"; exit 1; }
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          echo "Production artifacts verified successfully."

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloud Environment
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Verify Deployment Health Readiness
        run: |
          echo "Harmony Notes deployment bundle is ready for live traffic."
